].map(([id,sec,roles,text,only])=>({id,sec,roles,text,only}));
const LINE = Object.fromEntries(LINES.map(l=>[l.id,l]));
const REASONS = {time:'Ran out of time',forgot:'Forgot',na:'Not needed today',unsure:'Not sure how'};

// Pre = before the first class. Post = after the block's last class.
const PRE_SECS = ['arrival','huddle'];
const IN_CLASS_SECS = ['arriving','demo','starting','during'];
// In-class standards are parked until we decide where they live. Flip to true to show them in Post.
const SHOW_IN_CLASS = false;
const POST_SECS = SECTIONS.map(s=>s.id).filter(id=>['ends','clean','amclose','pmclose'].includes(id)||(SHOW_IN_CLASS&&IN_CLASS_SECS.includes(id)));

const ANCHOR_LINES = [
  'I am the standard in this room. Everyone leaves better than when they walked in.',

const IDENTITY_LINES = [
  'This is the standard we hold each other to.',
  'This is who we are.',

];
let doneLine='';

/* ---------- Timetable (locked 17 Sep 2026) ---------- */
// day-of-week: 0 Sun ... 6 Sat. Sunday closed. Hyrox Self Lead excluded (not coached).
const TIMETABLE = {
  0: {am:[], pm:[], perform:[]},
  1: {am:['04:50','05:50','06:50','08:00','09:00','10:00'], pm:['16:30','17:30'], perform:['04:50','05:50','09:00']},
  2: {am:['04:50','05:50','06:50','08:00','09:00','10:00'], pm:['16:30','17:30'], perform:['04:50','05:50','09:00']},

};
// Blocks: Block 1 (before 7:30am), Block 2 (7:30am to noon), PM (noon on)
const BLOCK_NAME = {early:'Block 1',late:'Block 2',pm:'PM'};
const BLOCK_ORDER = ['early','late','pm'];

/* ---------- Helpers ---------- */
const $ = s=>document.querySelector(s);
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n=>String(n).padStart(2,'0');
const ymd = d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const toMin = t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
const fmtTime = t=>{const [h,m]=t.split(':').map(Number);const hh=((h+11)%12)+1;return hh+(m?':'+pad(m):'')+(h<12?'am':'pm')};
const sleep = ms=>new Promise(r=>setTimeout(r,ms));
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

function dayInfo(dateStr){return TIMETABLE[new Date(dateStr+'T00:00:00').getDay()]}
function blockOf(t){const m=toMin(t);return m<450?'early':(m<720?'late':'pm')}
function blocksFor(dateStr){
  const d=dayInfo(dateStr);
  const out={};
  d.am.concat(d.pm).forEach(t=>{const b=blockOf(t);(out[b]=out[b]||{id:b,name:BLOCK_NAME[b],classes:[],perform:[]}).classes.push(t)});
  d.perform.forEach(t=>{const b=blockOf(t);if(out[b])out[b].perform.push(t)});
  return BLOCK_ORDER.filter(b=>out[b]).map(b=>out[b]);
}
function blockCloses(dateStr,blk){
  const d=dayInfo(dateStr);
  const all=d.am.concat(d.pm);
  const dayMax=Math.max(...all.map(toMin));
  const amMax=d.am.length?Math.max(...d.am.map(toMin)):null;
  const perfMax=d.perform.length?Math.max(...d.perform.map(toMin)):null;
  const has=(list,m)=>m!=null&&list.some(c=>toMin(c)===m);
  return {am:has(blk.classes,amMax)&&d.pm.length>0,pm:has(blk.classes,dayMax),track:has(blk.perform,perfMax)};
}
function isNow(blk){
  const n=new Date();const m=n.getHours()*60+n.getMinutes();
  const mins=blk.classes.map(toMin);
  return m>=Math.min(...mins)-60&&m<=Math.max(...mins)+60;
}
function summarizeClasses(classes){
  const t=[...(classes||[])].sort((a,b)=>toMin(a)-toMin(b));
  if(!t.length)return '';
  if(t.length===1)return fmtTime(t[0]);
  return fmtTime(t[0])+'–'+fmtTime(t[t.length-1])+' · '+t.length+' classes';
}
function owners(l){return l.roles.replace('S','')}
function ownerLabel(l){return {A:'Coach A',B:'Coach B',C:'Coach C',M:'Move space',AB:'Coach A + B',ABC:'All coaches'}[owners(l)]||''}
function visible(l,blk,closes){
  const o=owners(l);
  if(!o)return false;
  if(l.only&&!l.only.includes(blk.id))return false;
  if(l.sec==='amclose')return o==='C'?(closes.track&&blk.perform.length>0):closes.am;
  if(l.sec==='pmclose')return closes.pm;
  if(o==='C'&&!blk.perform.length)return false;
  return true;
}
const J=(v,d)=>v==null?d:v;
function normRow(r){
  return {...r,pre:J(r.pre,{}),post:J(r.post,{}),pre_coaches:J(r.pre_coaches,[]),post_coaches:J(r.post_coaches,[]),post_classes:J(r.post_classes,[]),missed:J(r.missed,{}),lines:J(r.lines,[]),ticked:J(r.ticked,[]),close:J(r.close,{})};
}
const sig = r=>JSON.stringify([r.pre,r.post,r.pre_coaches,r.post_coaches,r.post_classes,r.pre_done_at,r.submitted_at]);

/* ---------- State ---------- */
let coaches=[], coachesLoaded=false, view='coach';
let H={rows:{},loaded:false,error:false,msg:''};
let S=fresh();
function fresh(){return {screen:gateOk()?'home':'gate',date:ymd(new Date()),blockId:null,R:null,missed:{},rating:null,next:'',anchor:pickAnchor(),gateError:'',adding:false,addPh:'pre',saveError:'',saving:false,opening:false}}
let dash={weekStart:mondayOf(new Date()),data:null,loading:false,error:''};
function mondayOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return x}

/* ---------- Saving (every tick is written as it happens) ---------- */
let queue=[], flushP=null, syncError=false;
function applyOp(R,op){
  switch(op.k){
    case 'tick': {const m=R[op.phase];if(op.val)m[op.id]=op.val;else delete m[op.id];break}
    case 'names': R[op.phase+'_coaches']=op.list;break;
    case 'classes': R.post_classes=op.list;break;
    case 'predone': if(!R.pre_done_at)R.pre_done_at=op.at;break;
    case 'submit': Object.assign(R,op.fields);break;
  }
}
function enqueue(op){
  op.rowId=S.R.id;
  applyOp(S.R,op);
  queue.push(op);
  flush();
}
const SAVE_FIELDS=['pre','post','pre_coaches','pre_done_at','post_coaches','post_classes','missed','rating','next','lines','ticked','close','submitted_at'];
function flush(){
  if(flushP)return flushP;
  flushP=(async()=>{
    try{
      while(queue.length){
        const rid=queue[0].rowId;
        const batch=queue.filter(o=>o.rowId===rid);
        const {data,error}=await sb.from('blocks').select('*').eq('id',rid).single();
        if(error)throw error;
        const row=normRow(data);
        batch.forEach(op=>applyOp(row,op));
        const fields={updated_at:new Date().toISOString()};
        SAVE_FIELDS.forEach(f=>fields[f]=row[f]);
        const up=await sb.from('blocks').update(fields).eq('id',rid);
        if(up.error)throw up.error;
        queue=queue.filter(o=>!batch.includes(o));
        if(S.R&&S.R.id===rid&&!queue.some(o=>o.rowId===rid)&&sig(row)!==sig(S.R)){S.R=row;syncError=false;paint()}
      }
      if(syncError){syncError=false;paint()}
    }catch(e){
      if(!syncError){syncError=true;paint()}
      setTimeout(flush,4000);
    }finally{flushP=null}
  })();
  return flushP;
}
async function syncAll(){
  for(let i=0;i<3;i++){await flush();if(!queue.length)return true;await sleep(1500)}
  return !queue.length;
}
function paint(){if(S.screen==='pre'||S.screen==='post'||S.screen==='home')render()}
const syncBanner=()=>syncError&&queue.length?'<div class="notice">Not saved yet. Check the iPad is online. Your ticks are kept and will save when it is.</div>':'';

/* ---------- Data ---------- */
async function loadCoaches(){
  const {data,error}=await sb.from('coaches').select('name').order('name');
  if(!error&&data)coaches=data.map(r=>r.name);
  coachesLoaded=true;
}
async function loadHome(){
  S.date=ymd(new Date());
  const {data,error}=await sb.from('blocks').select('*').eq('date',S.date);
  H.rows={};
  if(!error&&data)data.forEach(r=>{H.rows[r.block]=normRow(r)});
  H.loaded=true;H.error=!!error;
  await loadCoaches();
  if(S.screen==='home'&&view==='coach')render();
}
async function ensureRow(date,block){
  await sb.from('blocks').upsert({date,block},{onConflict:'date,block',ignoreDuplicates:true});
  const {data,error}=await sb.from('blocks').select('*').eq('date',date).eq('block',block).maybeSingle();
  return error?null:data;
}
async function openBlock(id){
  if(S.opening)return;
  S.opening=true;H.msg='';
  const row=await ensureRow(S.date,id);
  S.opening=false;
  if(!row){H.msg='Couldn\'t open that block. Check the iPad is online and try again.';render();return}
  S.blockId=id;S.missed={};S.rating=null;S.next='';S.saveError='';S.adding=false;
  S.R=normRow(row);
  S.screen=S.R.submitted_at?'blockdone':(S.R.pre_done_at?'post':'pre');
  if(S.screen==='post')prefillPost();
  window.scrollTo(0,0);
  render();
}
function curBlk(){return blocksFor(S.date).find(b=>b.id===S.blockId)}
function ctx(){const blk=curBlk();return {blk,closes:blockCloses(S.date,blk)}}
function linesOf(phase){
  const {blk,closes}=ctx();
  const secs=phase==='pre'?PRE_SECS:POST_SECS;
  return LINES.filter(l=>secs.includes(l.sec)&&visible(l,blk,closes));
}
const phaseOf = l=>PRE_SECS.includes(l.sec)?'pre':'post';
const isTicked = l=>!!S.R[phaseOf(l)][l.id];
const allLines = ()=>linesOf('pre').concat(linesOf('post'));
function prefillPost(){
  const {blk}=ctx();
  if(!S.R.post_coaches.length&&S.R.pre_coaches.length)enqueue({k:'names',phase:'post',list:[...S.R.pre_coaches]});
  if(!S.R.post_classes.length)enqueue({k:'classes',list:[...blk.classes]});
}

/* ---------- Render ---------- */
function render(){
  const app=$('#app');const bar=$('#bar');const barIn=$('#barIn');
  bar.hidden=true;barIn.innerHTML='';
  $('#tabs').hidden=(S.screen==='gate');
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-pressed',String(t.dataset.v===view)));
  if(S.screen!=='gate'&&view==='dash'){app.innerHTML=renderDash();return}
  const fn={gate:rGate,home:rHome,pre:()=>rBlock('pre'),post:()=>rBlock('post'),missed:rMissed,close:rClose,done:rDone,blockdone:rBlockDone}[S.screen];
  app.innerHTML=fn();
  const b=barFor();if(b){bar.hidden=false;barIn.innerHTML=b}
}

function rGate(){
  return `<div class="gate-screen"><h1>Team Access</h1><p class="lede">Enter the BE-IT team code to open the coach checklist.</p>
  <div class="field"><input type="password" id="gateCode" placeholder="Team code" autocomplete="off" aria-label="Team code"></div>
  ${S.gateError?`<div class="notice">${esc(S.gateError)}</div>`:''}
  <button class="btn" data-act="gateSubmit">Enter</button></div>`;
}

function rHome(){
  const blks=blocksFor(S.date);
  let h=`<div class="anchor"><span class="step-tag">Anchor statement</span><p>${esc(S.anchor)}</p></div>`;
  h+=`<h1>Today</h1><p class="lede">${new Date(S.date+'T00:00:00').toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long'})}. One list for the whole team. Tick what's done, pick who's on, and anyone coming in can see what's left.</p>`;
  if(H.msg)h+=`<div class="notice">${esc(H.msg)}</div>`;
  if(!blks.length)return h+'<div class="empty">BE-IT is closed today. Nothing to sign off.</div>';
  if(H.error)h+='<div class="notice">Couldn\'t load today. Check the iPad is online.</div>';
  const nowId=(blks.find(isNow)||{}).id;
  h+='<div class="stack">'+blks.map(b=>{
    const r=H.rows[b.id];
    const closes=blockCloses(S.date,b);
    const preL=LINES.filter(l=>PRE_SECS.includes(l.sec)&&visible(l,b,closes));
    const postL=LINES.filter(l=>POST_SECS.includes(l.sec)&&visible(l,b,closes));
    let pre='Pre: not started',preDone=false,post='Post: waiting',postDone=false;
    if(r){
      const pt=preL.filter(l=>r.pre[l.id]).length;
      const qt=postL.filter(l=>r.post[l.id]).length;
      if(r.pre_done_at){pre=`Pre done · ${r.pre_coaches.join(', ')||'no names'}`;preDone=true}
      else if(pt||r.pre_coaches.length)pre=`Pre: ${pt}/${preL.length} ticked`;
      if(r.submitted_at){post=`Submitted · rated ${r.rating}`;postDone=true}
      else if(qt)post=`Post: ${qt}/${postL.length} ticked`;
    }
    return `<button class="blockcard${b.id===nowId?' now':''}" data-act="openBlock" data-v="${b.id}"><h2>${esc(b.name)}${b.id===nowId?'<span class="nowtag">Now</span>':''}</h2><div class="sub">${esc(summarizeClasses(b.classes))}</div><div class="st"><span class="pill${preDone?' done':''}">${esc(pre)}</span><span class="pill${postDone?' done':''}">${esc(post)}</span></div></button>`;
  }).join('')+'</div>';
  if(!H.loaded)h+='<p class="sec-note">Loading today…</p>';
  return h;
}

function itemBtn(l,showOwner){
  const on=isTicked(l);
  const who=showOwner?`<span class="who">${esc(ownerLabel(l))}</span>`:'';
  return `<button class="item" role="checkbox" aria-checked="${on}" data-act="tick" data-ph="${phaseOf(l)}" data-v="${l.id}"><span class="box">${CHECK}</span><span class="txt">${who}${esc(l.text)}</span></button>`;
}
function groupHead(name,ls){
  const c=ls.filter(isTicked).length;
  return `<div class="sec-head"><h2>${esc(name)}</h2><span class="sec-count${c===ls.length?' done':''}">${c}/${ls.length}</span></div>`;
}
function nameChips(ph){
  const sel=S.R[ph+'_coaches'];
  const names=[...new Set([...coaches,...sel])].sort((a,b)=>a.localeCompare(b));
  let h='<div class="row">'+names.map(n=>`<button class="chip" data-act="nameToggle" data-ph="${ph}" data-v="${esc(n)}" aria-pressed="${sel.includes(n)}">${esc(n)}</button>`).join('')+'</div>';
  h+=(S.adding&&S.addPh===ph)
    ?`<div class="addrow"><input type="text" id="newName" placeholder="First name" autocomplete="off" aria-label="First name"><button class="btn" data-act="addName">Add</button></div>`
    :`<button class="link" data-act="showAdd" data-ph="${ph}">Name not here? Add it</button>`;
  return h;
}

function rBlock(phase){
  const {blk,closes}=ctx();
  const lines=linesOf(phase);
  const done=lines.filter(isTicked).length;
  let badges='';
  if(phase==='post'){if(closes.am)badges+=' <span class="badge">AM close</span>';if(closes.pm)badges+=' <span class="badge">Day close</span>'}
  let h=syncBanner();
  h+=`<div class="counter"><div class="led">${pad(done)}/${pad(lines.length)}</div><div class="meta"><b>${phase==='pre'?'Pre':'Post'} · ${esc(blk.name)}</b>${esc(summarizeClasses(blk.classes))}${badges}</div></div>`;
  h+=`<div class="seg"><button class="segbtn" data-act="phase" data-v="pre" aria-pressed="${phase==='pre'}">Pre</button><button class="segbtn" data-act="phase" data-v="post" aria-pressed="${phase==='post'}">Post</button></div>`;
  if(phase==='pre'){
    h+='<p class="sec-note">One list for the whole team. Each group shows who usually does it, but anyone can tick anything.</p>';
    const groups={A:[],B:[],C:[],M:[],TEAM:[]};
    lines.forEach(l=>{const o=owners(l);groups[o.length===1?o:'TEAM'].push(l)});
    const heads={A:'Coach A',B:'Coach B',C:'Coach C · Perform',M:'Move space',TEAM:'Team'};
    ['A','B','C','M','TEAM'].forEach(k=>{
      if(!groups[k].length)return;
      h+=`<section class="sec">${groupHead(heads[k],groups[k])}${groups[k].map(l=>itemBtn(l,k==='TEAM')).join('')}</section>`;
    });
    h+=`<section class="sec"><div class="sec-head"><h2>Who's on?</h2></div><p class="sec-note">Pick everyone working this block.</p>${nameChips('pre')}</section>`;
    return h;
  }
  h+=`<section class="sec"><div class="sec-head"><h2>Who ran this block?</h2></div><p class="sec-note">Already filled in from Pre. Change it if needed.</p>${nameChips('post')}</section>`;
  h+=`<section class="sec"><div class="sec-head"><h2>Sessions you ran</h2></div><div class="row">${blk.classes.map(t=>`<button class="chip" data-act="classToggle" data-v="${t}" aria-pressed="${S.R.post_classes.includes(t)}">${fmtTime(t)}</button>`).join('')}</div></section>`;
  const open=linesOf('pre').filter(l=>!isTicked(l));
  if(open.length)h+=`<section class="sec"><div class="sec-head"><h2>Still open from Pre</h2><span class="sec-count">${open.length}</span></div>${open.map(l=>itemBtn(l,true)).join('')}</section>`;
  for(const sec of SECTIONS){
    const ls=lines.filter(l=>l.sec===sec.id);if(!ls.length)continue;
    h+=`<section class="sec">${groupHead(sec.name,ls)}${sec.note?`<p class="sec-note">${sec.note}</p>`:''}${ls.map(l=>itemBtn(l,true)).join('')}</section>`;
  }
  return h;
}

function rMissed(){
  const lines=allLines().filter(l=>!isTicked(l));
  return `<h1>Anything not ticked?</h1><p class="lede">One tap each. This shows whether it's a training need or a system that needs fixing.</p>`+
  lines.map(l=>`<div class="miss"><p>${esc(l.text)}</p><div class="row">${Object.entries(REASONS).map(([k,v])=>`<button class="chip" data-act="reason" data-line="${l.id}" data-v="${k}" aria-pressed="${S.missed[l.id]===k}">${v}</button>`).join('')}</div></div>`).join('');
}

function rClose(){
  return `<h1>Close out your block</h1>
  <div class="field"><span class="label">Did every member in the session leave better than they walked in?</span>
    <div class="rating">${[1,2,3,4,5].map(n=>`<button class="rate" data-act="rate" data-v="${n}" aria-pressed="${S.rating===n}" aria-label="${n} out of 5"><b>${n}</b></button>`).join('')}</div>
    <div class="scale"><span>1 Unsure</span><span>5 100% certain</span></div></div>
  <div class="field"><label class="label" for="next">What would make your next session a 5? Anything the team needs to know?</label>
    <textarea id="next" placeholder="One thing, in your words">${esc(S.next)}</textarea></div>
  ${S.saveError?`<div class="notice">${esc(S.saveError)}</div>`:''}`;

function rDone(){
  return `<div class="done-screen"><div class="stars">★★★★★</div><h1>Block saved</h1><p class="lede" style="margin:8px auto 4px">Thanks team. Pack down and go well.</p><p class="identity">${esc(doneLine)}</p><button class="btn" data-act="home">Back to today</button></div>`;
}
function rBlockDone(){
  const r=S.R;
  return `<div class="done-screen"><h1>${esc(BLOCK_NAME[S.blockId])} is done</h1><p class="lede" style="margin:8px auto 4px">Submitted · rated ${esc(r.rating)} · ${esc((r.post_coaches||[]).join(', '))}</p><button class="btn" data-act="home">Back to today</button></div>`;
}

function barFor(){
  const s=S.screen;
  if(s==='pre'){
    const ok=S.R.pre_coaches.length>0;
    return S.R.pre_done_at
      ?`<button class="btn ghost" data-act="home">Back to today</button><button class="btn" data-act="phase" data-v="post">Go to Post</button>`
      :`<button class="btn ghost" data-act="home">Back to today</button><button class="btn" data-act="preDone" ${ok?'':'disabled'}>${ok?'Pre done':'Pick who\'s on'}</button>`;
  }
  if(s==='post'){
    const ok=S.R.post_coaches.length>0&&S.R.post_classes.length>0;
    return `<button class="btn ghost" data-act="home">Back to today</button><button class="btn" data-act="finishPost" ${ok?'':'disabled'}>${ok?'Finish block':'Pick names + sessions'}</button>`;
  }
  if(s==='missed'){
    const ok=allLines().filter(l=>!isTicked(l)).every(l=>S.missed[l.id]);
    return `<button class="btn ghost" data-act="toPost">Back</button><button class="btn" data-act="toClose" ${ok?'':'disabled'}>Next</button>`;
  }
  if(s==='close'){
    const ok=S.rating&&S.next.trim().length>0&&!S.saving;
    return `<button class="btn ghost" data-act="closeBack">Back</button><button class="btn" data-act="submit" ${ok?'':'disabled'}>${S.saving?'Saving…':'Submit block'}</button>`;
  }
  if(s==='blockdone')return `<button class="btn ghost" data-act="home">Back to today</button>`;
  return '';
}

/* ---------- Actions ---------- */
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act, v=el.dataset.v, ph=el.dataset.ph;
  if(el.tagName==='TEXTAREA')return;
  switch(a){
    case 'gateSubmit': {
      const val=($('#gateCode')?.value||'').trim();
      if(val.toUpperCase()===TEAM_CODE.toUpperCase()){setGateOk();S.screen='home';S.gateError='';loadHome()}
      else S.gateError='That code isn\'t right. Check with your Head Coach.';
      break;
    }
    case 'tab': view=v; if(v==='dash')loadDash(); else if(S.screen==='home')loadHome(); break;
    case 'home': S.screen='home';S.R=null;S.blockId=null;window.scrollTo(0,0);loadHome(); break;
    case 'openBlock': await openBlock(v); return;
    case 'phase': S.screen=v;if(v==='post')prefillPost();window.scrollTo(0,0); break;
    case 'tick': enqueue({k:'tick',phase:ph,id:v,val:S.R[ph][v]?0:Date.now()}); break;
    case 'nameToggle': {
      const cur=S.R[ph+'_coaches'];
      enqueue({k:'names',phase:ph,list:cur.includes(v)?cur.filter(n=>n!==v):[...cur,v]});
      break;
    }
    case 'classToggle': {
      const cur=S.R.post_classes;
      const list=cur.includes(v)?cur.filter(t=>t!==v):[...cur,v].sort((x,y)=>toMin(x)-toMin(y));
      enqueue({k:'classes',list});
      break;
    }
    case 'showAdd': S.adding=true;S.addPh=ph; render(); setTimeout(()=>$('#newName')?.focus(),0); return;
    case 'addName': await addName(); return;
    case 'preDone': enqueue({k:'predone',at:new Date().toISOString()});
      if(!S.R.post_coaches.length)enqueue({k:'names',phase:'post',list:[...S.R.pre_coaches]});
      S.screen='home';S.R=null;S.blockId=null;window.scrollTo(0,0);loadHome(); break;
    case 'finishPost': {
      const un=allLines().filter(l=>!isTicked(l));
      S.screen=un.length?'missed':'close';window.scrollTo(0,0); break;
    }
    case 'reason': S.missed[el.dataset.line]=v; break;
    case 'toPost': S.screen='post'; break;
    case 'toClose': S.screen='close';window.scrollTo(0,0); break;
    case 'closeBack': S.screen=allLines().some(l=>!isTicked(l))?'missed':'post'; break;
    case 'rate': S.rating=Number(v); break;
    case 'submit': await submit(); return;
    case 'week': dash.weekStart=new Date(dash.weekStart.getFullYear(),dash.weekStart.getMonth(),dash.weekStart.getDate()+Number(v)*7); loadDash(); break;
    case 'refresh': loadDash(); break;
    case 'removeCoach': await removeCoach(v); return;
  }
  render();
});
document.addEventListener('input',e=>{
  if(e.target.id==='next'){
    S.next=e.target.value;
    const b=document.querySelector('[data-act="submit"]');
    if(b)b.disabled=!(S.rating&&S.next.trim()&&!S.saving);
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='newName'){e.preventDefault();addName()}
  if(e.key==='Enter'&&e.target.id==='gateCode'){e.preventDefault();document.querySelector('[data-act="gateSubmit"]')?.click()}
});

async function addName(){
  const inp=$('#newName');const name=(inp?.value||'').trim().replace(/\s+/g,' ');
  if(!name)return;
  const nice=name.charAt(0).toUpperCase()+name.slice(1);
  S.adding=false;
  let final=coaches.find(c=>c.toLowerCase()===nice.toLowerCase());
  if(!final){
    const {error}=await sb.from('coaches').insert({name:nice});
    if(!error||error.code==='23505'){coaches=[...coaches,nice];final=nice}
  }
  if(final){
    const cur=S.R[S.addPh+'_coaches'];
    if(!cur.includes(final))enqueue({k:'names',phase:S.addPh,list:[...cur,final]});
  }
  render();
}
async function removeCoach(name){
  if(!confirm('Remove '+name+' from the coach list? Their past blocks stay in the data.'))return;
  await sb.from('coaches').delete().eq('name',name);
  coaches=coaches.filter(c=>c!==name);
  render();
}

async function submit(){
  if(S.saving)return;
  S.saving=true;S.saveError='';render();
  const lines=allLines();
  const {closes}=ctx();
  const missed=Object.fromEntries(lines.filter(l=>!isTicked(l)).map(l=>[l.id,S.missed[l.id]||'forgot']));
  queue=queue.filter(o=>o.k!=='submit');
  enqueue({k:'submit',fields:{
    lines:lines.map(l=>l.id),ticked:lines.filter(isTicked).map(l=>l.id),missed,
    rating:S.rating,next:S.next.trim().slice(0,1000),close:{am:closes.am,pm:closes.pm},
    submitted_at:new Date().toISOString()
  }});
  const ok=await syncAll();
  S.saving=false;
  if(ok){doneLine=IDENTITY_LINES[Math.floor(Math.random()*IDENTITY_LINES.length)];S.screen='done';window.scrollTo(0,0)}
  else S.saveError='This block didn\'t save. Check the iPad is online, then tap Submit block again. Your ticks are kept.';
  render();
}

/* ---------- Keep every device in step ---------- */
setInterval(async()=>{
  if(S.screen==='gate'||document.hidden||view!=='coach')return;
  if((S.screen==='pre'||S.screen==='post')&&S.R&&!queue.length&&!flushP){
    const {data}=await sb.from('blocks').select('*').eq('id',S.R.id).maybeSingle();
    if(data&&!queue.length&&!flushP){
      const n=normRow(data);
      if(sig(n)!==sig(S.R)){S.R=n;if(n.submitted_at)S.screen='blockdone';render()}
    }
  }else if(S.screen==='home'&&!S.opening){await loadHome()}
},8000);

/* ---------- Dashboard (team results) ---------- */
async function loadDash(){
  dash.loading=true;dash.error='';render();
  const ws=ymd(dash.weekStart);const we=ymd(new Date(dash.weekStart.getFullYear(),dash.weekStart.getMonth(),dash.weekStart.getDate()+6));
  const {data,error}=await sb.from('blocks').select('*').gte('date',ws).lte('date',we).not('submitted_at','is',null).limit(1000);
  if(error){dash.error='The week\'s data didn\'t load. Tap Refresh to try again.';dash.data=null}
  else dash.data=data.map(normRow);
  dash.loading=false;render();
}

function renderDash(){
  const ws=dash.weekStart;const we=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+6);
  const fmt=d=>d.toLocaleDateString('en-AU',{day:'numeric',month:'short'});
  let h=`<h1>Weekly floor report</h1><p class="lede">Team results: where the standard is holding, where it's slipping, and what the team says would make it a 5.</p>
  <div class="weeknav"><button class="btn ghost" data-act="week" data-v="-1">Previous week</button><h2 style="margin:0">${fmt(ws)} to ${fmt(we)}</h2><button class="btn ghost" data-act="week" data-v="1">Next week</button></div>`;
  if(dash.loading)return h+'<p class="empty">Loading the week…</p>';
  if(dash.error)return h+`<div class="notice">${esc(dash.error)}</div><button class="btn" data-act="refresh">Refresh</button>`;
  const rows=dash.data||[];
  if(!rows.length)return h+'<div class="empty">No blocks submitted this week yet. Once a team finishes a block, this fills in.</div>'+coachAdmin();

  let app=0,tick=0,ratings=[];
  const byLine={},reasons={time:0,forgot:0,na:0,unsure:0};
  rows.forEach(r=>{
    const na=Object.entries(r.missed).filter(([,v])=>v==='na').map(([k])=>k);
    const counted=r.lines.filter(id=>!na.includes(id));
    app+=counted.length;tick+=r.ticked.length;
    if(r.rating)ratings.push(r.rating);
    r.lines.forEach(id=>{
      const L=byLine[id]||(byLine[id]={app:0,tick:0,why:{}});
      if(na.includes(id)){L.why.na=(L.why.na||0)+1;return}
      L.app++;if(r.ticked.includes(id))L.tick++;
      else{const w=r.missed[id]||'forgot';L.why[w]=(L.why[w]||0)+1}
    });
    Object.values(r.missed).forEach(w=>{reasons[w]=(reasons[w]||0)+1});
  });
  const pct=(a,b)=>b?Math.round(a/b*100):0;
  const avg=a=>a.length?(a.reduce((x,y)=>x+y,0)/a.length):0;

  h+=`<div class="stats">
    <div class="stat"><div class="led">${rows.length}</div><span>Blocks logged</span></div>
    <div class="stat"><div class="led">${pct(tick,app)}%</div><span>Standards completed</span></div>
    <div class="stat"><div class="led">${avg(ratings).toFixed(1)}</div><span>Average "left better" rating</span></div>
  </div>`;

  const lineRows=Object.entries(byLine).filter(([,L])=>L.app>0).map(([id,L])=>({id,...L,p:pct(L.tick,L.app)})).sort((a,b)=>a.p-b.p||b.app-a.app);
  const slipping=lineRows.filter(l=>l.p<100);
  h+=`<section class="panel"><h2>Lines slipping most</h2>`;
  if(!slipping.length)h+='<div class="empty">Every applicable line was ticked this week.</div>';
  else h+=`<div class="scroll"><table><thead><tr><th>Standard</th><th>Main reason missed</th><th class="num">Done</th></tr></thead><tbody>${slipping.slice(0,12).map(l=>{
    const L=LINE[l.id];
    const top=Object.entries(l.why).filter(([k])=>k!=='na').sort((a,b)=>b[1]-a[1])[0];
    return `<tr><td>${esc(L?L.text:l.id)}<br><span class="sec-note">${esc(L?ownerLabel(L):'')}</span></td><td>${top?esc(REASONS[top[0]])+' ('+top[1]+')':''}</td><td class="num">${l.p}%<div class="meter${l.p>=90?' good':''}"><i style="width:${l.p}%"></i></div></td></tr>`;
  }).join('')}</tbody></table></div>`;
  h+='</section>';

  const sorted=[...rows].sort((a,b)=>b.date.localeCompare(a.date)||BLOCK_ORDER.indexOf(a.block)-BLOCK_ORDER.indexOf(b.block));
  h+=`<section class="panel"><h2>Block by block</h2><div class="scroll"><table><thead><tr><th>Block</th><th>Who was on</th><th class="num">Done</th><th class="num">Rating</th></tr></thead><tbody>${sorted.map(r=>{
    const na=Object.values(r.missed).filter(v=>v==='na').length;
    const p=pct(r.ticked.length,r.lines.length-na);
    const d=new Date(r.date+'T00:00:00').toLocaleDateString('en-AU',{weekday:'short'});
    return `<tr><td>${d} · ${esc(BLOCK_NAME[r.block]||r.block)}</td><td>${esc(r.post_coaches.join(', '))}</td><td class="num">${p}%<div class="meter${p>=90?' good':''}"><i style="width:${p}%"></i></div></td><td class="num">${r.rating??'–'}</td></tr>`;
  }).join('')}</tbody></table></div></section>`;

  const totalMiss=Object.values(reasons).reduce((a,b)=>a+b,0);
  h+=`<section class="panel"><h2>Why lines were missed</h2>`;
  if(!totalMiss)h+='<div class="empty">Nothing missed this week.</div>';
  else h+=`<table><tbody>${Object.entries(REASONS).map(([k,v])=>`<tr><td>${v}${k==='unsure'?'<br><span class="sec-note">A training need</span>':k==='time'?'<br><span class="sec-note">A system or timing problem</span>':''}</td><td class="num">${reasons[k]||0}<div class="meter"><i style="width:${pct(reasons[k]||0,totalMiss)}%"></i></div></td></tr>`).join('')}</tbody></table>`;
  h+='</section>';

  const feed=rows.filter(r=>r.next).sort((a,b)=>new Date(b.submitted_at)-new Date(a.submitted_at));
  h+=`<section class="panel"><h2>What would make the next session a 5</h2>`;
  h+=feed.length?`<ul class="feed">${feed.map(r=>{
    const d=new Date(r.date+'T00:00:00').toLocaleDateString('en-AU',{weekday:'short'});
    return `<li><div class="by">${esc(r.post_coaches.join(', '))} · ${d} ${esc(BLOCK_NAME[r.block]||r.block)} · rated ${r.rating}</div>${esc(r.next)}</li>`;
  }).join('')}</ul>`:'<div class="empty">No answers yet this week.</div>';
  h+='</section>';
  return h+coachAdmin();
}

function coachAdmin(){
  if(!coaches.length)return '';
  return `<section class="panel"><h2>Coach list</h2><table><tbody>${coaches.map(c=>`<tr><td>${esc(c)}</td><td class="num"><button class="remove" data-act="removeCoach" data-v="${esc(c)}">Remove</button></td></tr>`).join('')}</tbody></table></section>`;
}

/* ---------- Boot ---------- */
render();
if(S.screen==='home')loadHome();
</script>
